# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.caching.debug=false

fabric_kotlin_version=1.13.1+kotlin.2.1.10

mod_version=1.0.0
# Allowed: stable, beta, alpha
mod_release_channel=alpha
mod_prerelease_number=0
minor_update_notes=v1.0.0 Update! This is the first full release of Bazaar Utils, and it includes a lot of new features and improvements! Check out the changelog for more details.

maven_group=com.github.mkram17.bazaarutils

deps.orbit_version=0.2.4
deps.devauth_version=1.2.1
deps.hypixel_api_version=4.4
deps.apache_httpclient_version=4.5.14
deps.apache_httpcore_version=4.4.16
deps.commons_logging_version=1.2
deps.commons_codec_version=1.16.0
deps.lombok_version=1.18.36
deps.mixinconstraints_version=1.0.8
deps.gson_extras_version=3.3.0
deps.autoupdate_version=1.3.1

description=Bazaar Utils is a QOL mod for the Bazaar. It has useful features like outdated order notifications, item bookmarks, custom buy order amount shortcuts, and more!
authors=mkram17
license=CC-BY-NC-4.0
source_url=https://github.com/mkram17/Bazaar-Utils
website=https://modrinth.com/mod/bazaar-utils


#STONECUTTER
mod.id=bazaarutils
#Release for the lowest possible version and then use max version to allow for higher.
deps.core.mcVersion=[VERSIONED]
deps.core.maxMcVersion=[VERSIONED]

# Version ranges are INCLUSIVE! The minimum version must be set, this is the value used to retrieve the dependency from network.
deps.fabricLoaderVersion=0.17.2