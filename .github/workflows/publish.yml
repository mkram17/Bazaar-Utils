name: Publish modern

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and preview publishing without uploading releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-modern
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: publishing
    permissions:
      contents: write
    steps:
      - name: Check out modern
        uses: actions/checkout@v6
        with:
          ref: modern
          persist-credentials: false

      - name: Record release commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check publishing credentials
        if: ${{ !inputs.dry_run }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo "::error::Missing MODRINTH_TOKEN in the publishing environment"; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo "::error::Missing CURSEFORGE_TOKEN in the publishing environment"; exit 1; }

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build all Minecraft versions
        run: bash ./gradlew --no-daemon build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release JARs
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

      - name: Publish all Minecraft versions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew --no-daemon publishMods "-PpublishDryRun=$DRY_RUN"
